---
- name: Instalar y configurar Docker y Docker Compose de manera limpia
  hosts: all
  become: yes

  vars:
    docker_compose_version: "v2.33.1"
    target_user: "{{ ansible_user | default(ansible_env.SUDO_USER | default(ansible_user_id)) }}"

  tasks:
    - name: Remover paquetes antiguos o no oficiales en conflicto
      apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: yes

    - name: Instalar dependencias necesarias
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Crear directorio seguro para keyrings de apt
      file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Descargar clave GPG oficial de Docker
      get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: yes

    - name: Configurar repositorio oficial de Docker
      apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: yes

    - name: Instalar Docker Engine, CLI, containerd y plugins oficiales
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: yes

    - name: Asegurar directorio de configuración de Docker
      file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configurar daemon.json (rotación de logs y defaults)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3",
              "compress": "true"
            }
          }
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar docker

    - name: Habilitar y arrancar servicios de Docker
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - docker
        - containerd

    - name: Asegurar permisos en socket de Docker
      file:
        path: /var/run/docker.sock
        owner: root
        group: docker
        mode: '0660'
      ignore_errors: yes

    - name: Identificar usuario para grupo docker
      set_fact:
        target_username: "{{ ansible_env.SUDO_USER if (ansible_env.SUDO_USER is defined and ansible_env.SUDO_USER != 'root') else (ansible_user if ansible_user is defined else lookup('env', 'USER')) }}"

    - name: Agregar usuario al grupo docker
      user:
        name: "{{ target_username }}"
        groups: docker
        append: yes
      when: target_username is defined and target_username != '' and target_username != 'root'

    - name: Verificar instalación de Docker y Docker Compose
      command: docker compose version
      register: compose_ver
      changed_when: false

    - name: Mostrar versión instalada y aviso de activación de grupo
      debug:
        msg:
          - "Docker instalado con éxito: {{ compose_ver.stdout }}"
          - "AVISO: Para activar el grupo 'docker' en tu terminal activa inmediatamente sin reiniciar sesión, ejecuta: newgrp docker"

  handlers:
    - name: Reiniciar docker
      systemd:
        name: docker
        state: restarted
