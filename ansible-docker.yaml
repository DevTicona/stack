---
- name: Instalar y configurar Docker con rotación de logs
  hosts: all
  become: yes

  tasks:
    - name: Instalar dependencias
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
        state: present
        update_cache: yes

    - name: Agregar clave GPG de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Agregar repositorio oficial de Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Instalar Docker Engine y complementos
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: latest
        update_cache: yes

    - name: Habilitar y asegurar inicio automático de Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Instalar Docker Compose (plugin moderno)
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: '0755'

    - name: Crear archivo de configuración de Docker
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3",
              "compress": "true"
            }
          }
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar Docker para aplicar configuración
      systemd:
        name: docker
        state: restarted

    - name: Verificar versión instalada
      command: docker --version
      register: docker_version

    - debug:
        msg: "Docker instalado correctamente: {{ docker_version.stdout }}"
