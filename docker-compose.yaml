services:
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
#      - "443:443"  # Si luego quieres usar HTTPS
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf:ro
    networks:
      - red_app1
      - red_app2

networks:
  red_app1:
    external: true
  red_app2:
    external: true
