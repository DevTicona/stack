
services:
# --- OPCIÓN 1: usar Nginx como proxy frontal ---
services:
  nginx-frontal:
    image: nginx:alpine
    container_name: nginx-frontal
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    dns:
      - 8.8.8.8
      - 1.1.1.1

