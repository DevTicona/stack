events {}

http {
    server {
        listen 80;
        server_name sistema1.midominio.com;

        location / {
            proxy_pass http://nginx_app1:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name sistema2.midominio.com;

        location / {
            proxy_pass http://nginx_app2:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
